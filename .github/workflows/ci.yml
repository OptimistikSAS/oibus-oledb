name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The helper targets net10.0-windows: OLE DB only exists on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install npm dependencies
        run: npm ci

      # The same self-contained single-file build as the published one, so that the integration tests below run
      # the helper that would be shipped.
      - name: Build the .NET helper
        run: npm run build:runtimes

      - name: Build the TypeScript package
        run: npm run build

      # SQL Server LocalDB and the Microsoft OLE DB Driver for SQL Server come with GitHub's Windows runners: the
      # integration tests (src/helper.integration.spec.ts) query it through the real helper.
      - name: Start SQL Server LocalDB
        run: sqllocaldb start MSSQLLocalDB || sqllocaldb create MSSQLLocalDB -s

      - name: Run tests
        run: npm test
        env:
          OIBUS_OLEDB_INTEGRATION_CONNECTION_STRING: 'Provider=MSOLEDBSQL;Data Source=(localdb)\MSSQLLocalDB;Integrated Security=SSPI'
